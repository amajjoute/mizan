<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <script type="module" src="js/main.js" defer></script>
    <title>Mizan - c'est une platform qui gére... </title>
</head>
<body>
    <header>
        <div class="header">
            <div class="title">
                <h1>MIZAN   |   </h1>
                <p>Cours de l'or</p>
            </div>

            <div class="select-actualiser">
                <select name="curreuncy" id="curreuncy">
                    <option value="mad">MAD</option>
                    <option value="usd">USD</option>
                    <option value="eur">EUR</option>
                </select>

                <div id="actualiser" class="actualiser">
                    <button>Actualiser</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <section>
            <div id="date-update" class="date-update">
                <p>Dernière mise à jour : </p>
            </div>
        </section>

        <section>
            <div class="cards">
                <div class="or-card">
                    <div>
                        <h3>Or</h3>
                    </div>

                    <div id="or-price-info" class="or-price-info">
                    </div>

                    <div id="or-all-info" class="or-all-info">
                    </div>
                </div>

                <div class="money-card">
                    <div>
                        <h3>Argent</h3>
                    </div>

                    <div id="money-price-info" class="money-price-info">
                    </div>

                    <div id="money-all-info" class="money-all-info">
                    </div>
                </div>
            </div>
        </section>

        <section></section>

        <section></section>
    </main>
</body>
</html>
